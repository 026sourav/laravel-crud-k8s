version: "3.8"

volumes:
    laravel-mysql-data:
    

networks:
    laravel-network:
      driver: bridge

services:

  


  mysql:
   image: mysql:5.7
   container_name: mysql-container
   restart: unless-stopped
   environment:
    MYSQL_ROOT_PASSWORD: root
    MYSQL_DATABASE: laravel
    MYSQL_USER: laravel
    MYSQL_PASSWORD: secret
   volumes:
    - laravel-mysql-data:/var/lib/mysql
   networks:
    - laravel-network


  app:
     image: sourav1911/laravel-crud-app:latest
     container_name: laravel-container
     ports:
       - "8000:80"
     volumes:
       - ./:/var/www/html
     networks:
       - laravel-network
     depends_on:
       - mysql



