apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql-crud
  namespace: laravel-crud
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql-crud
  template:
    metadata:
      labels:
       app: mysql-crud
    spec:
     containers:
        - name: mysql-container
          image: mysql:5.7
          ports: 
           - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              value: laravel_db

          volumeMounts:
            - name: mysql-storage
              mountPath: /var/lib/mysql

     volumes:
       - name: mysql-storage
         persistentVolumeClaim:
             claimName: crud-pvc



