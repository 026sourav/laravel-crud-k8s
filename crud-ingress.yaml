apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: 
 name: crud-ingress
 namespace: laravel-crud
spec:
  rules:
  - host: laravel.crud
    http:
       paths:
       - path: /
         pathType: Prefix
         backend:
           service: 
             name: crud-service
             port:
              number: 80
